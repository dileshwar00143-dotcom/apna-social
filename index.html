
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>APNA - Social Media</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f4f5f9;color:#20212a;font-family:Arial,sans-serif}
header{background:#fff;padding:16px 20px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 2px 10px #0001;position:sticky;top:0}
.logo{font-size:27px;font-weight:900;color:#6555db}
main{max-width:620px;margin:20px auto;padding:0 12px}
.card{background:white;padding:18px;border-radius:16px;margin-bottom:16px;box-shadow:0 3px 15px #0000000b}
input,textarea{width:100%;padding:13px;border:1px solid #ddd;border-radius:10px;margin:7px 0;font-size:15px}
button{border:0;border-radius:10px;padding:11px 16px;background:#6555db;color:white;font-weight:bold;cursor:pointer;margin:4px}
button.secondary{background:#eee;color:#333}
button:disabled{opacity:.5}
.post{background:white;padding:17px;border-radius:16px;margin:14px 0;box-shadow:0 3px 15px #0000000b}
.post img,.post video{width:100%;max-height:450px;object-fit:contain;border-radius:12px;margin-top:10px;background:#eee}
.small{font-size:12px;color:#777}
#message{padding:10px;color:#6555db}
.hidden{display:none}
h2{margin-top:0}
</style>
</head>
<body>
<header>
 <div class="logo">APNA</div>
 <button id="logout" class="secondary hidden">Logout</button>
</header>

<main>
 <div id="message">APNA में आपका स्वागत है!</div>

 <section id="auth" class="card">
  <h2 id="authTitle">APNA में Login करें</h2>
  <input id="email" type="email" placeholder="Email address">
  <input id="password" type="password" placeholder="Password">
  <button id="authButton">Login</button>
  <button id="switchAuth" class="secondary">नया अकाउंट बनाएँ</button>
 </section>

 <section id="app" class="hidden">
  <div class="card">
   <h2>अपनी पोस्ट शेयर करें</h2>
   <textarea id="content" rows="3" placeholder="आज आपके मन में क्या है?"></textarea>
   <input id="media" type="file" accept="image/jpeg,image/png,image/webp,video/mp4,video/webm">
   <button id="publish">पोस्ट शेयर करें</button>
  </div>
  <h2>आपकी फीड</h2>
  <div id="feed"></div>
 </section>
</main>

<script>
const SUPABASE_URL = "https://jjmyllrmkbktsdiutmtq.supabase.co";
const SUPABASE_KEY = "sb_publishable_n4DgL2Lqej-nFUZlCNbTHQ_Zbii6WGz";

const db = window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let currentUser = null;
let signupMode = false;

const $ = id => document.getElementById(id);
const say = msg => $("message").textContent = msg;

function escapeHTML(value){
 return String(value ?? "").replace(/[&<>"']/g,c=>({
 "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
 })[c]);
}

function showApp(user){
 currentUser = user;
 $("auth").classList.toggle("hidden",!!user);
 $("app").classList.toggle("hidden",!user);
 $("logout").classList.toggle("hidden",!user);
 if(user) loadPosts();
}

$("switchAuth").onclick=()=>{
 signupMode=!signupMode;
 $("authTitle").textContent=signupMode?"नया अकाउंट बनाएँ":"APNA में Login करें";
 $("authButton").textContent=signupMode?"Sign Up":"Login";
 $("switchAuth").textContent=signupMode?"पहले से अकाउंट है? Login":"नया अकाउंट बनाएँ";
};

$("authButton").onclick=async()=>{
 const email=$("email").value.trim();
 const password=$("password").value;
 if(!email||password.length<6){say("सही Email और कम से कम 6 अक्षर का Password डालें।");return;}
 $("authButton").disabled=true;
 let result;
 if(signupMode){
  result=await db.auth.signUp({email,password});
 }else{
  result=await db.auth.signInWithPassword({email,password});
 }
 $("authButton").disabled=false;
 if(result.error){say(result.error.message);return;}
 if(signupMode){
  say("Signup अनुरोध सफल! Email confirmation माँगा जाए तो अपना Email verify करें, फिर Login करें।");
 }else{
  say("Login सफल!");
 }
};

$("logout").onclick=async()=>{
 await db.auth.signOut();
 showApp(null);
 say("आप Logout हो गए हैं।");
};

async function loadPosts(){
 const feed=$("feed");
 feed.innerHTML="<p>पोस्ट लोड हो रही हैं...</p>";
 const {data:posts,error}=await db.from("posts")
  .select("*").order("created_at",{ascending:false}).limit(30);
 if(error){feed.textContent="पोस्ट लोड नहीं हुई: "+error.message;return;}
 feed.innerHTML="";
 if(!posts || posts.length===0){feed.innerHTML="<div class='card'>अभी कोई पोस्ट नहीं है। अपनी पहली पोस्ट शेयर करें!</div>";return;}

 for(const post of posts){
  let mediaHTML="";
  if(post.media_url){
   const {data}=await db.storage.from("apna-media").createSignedUrl(post.media_url,3600);
   if(data?.signedUrl){
    mediaHTML=post.media_type==="video"
     ?`<video controls src="${data.signedUrl}"></video>`
     :`<img src="${data.signedUrl}" alt="Post media">`;
   }
  }
  const {count}=await db.from("likes").select("*",{count:"exact",head:true}).eq("post_id",post.id);
  const {data:myLike}=await db.from("likes").select("id").eq("post_id",post.id).eq("user_id",currentUser.id).maybeSingle();
  const article=document.createElement("article");
  article.className="post";
  article.innerHTML=`
   <div><b>APNA User</b></div>
   <div class="small">${escapeHTML(new Date(post.created_at).toLocaleString())}</div>
   <p>${escapeHTML(post.content)}</p>
   ${mediaHTML}
   <div style="margin-top:12px">
    <button class="like secondary">${myLike?"♥":"♡"} Like (${count||0})</button>
    <button class="comment secondary">Comment</button>
   </div>
   <div class="small">${post.user_id===currentUser.id?"आपकी पोस्ट":""}</div>`;
  article.querySelector(".like").onclick=()=>toggleLike(post.id,!!myLike);
  article.querySelector(".comment").onclick=()=>addComment(post.id);
  feed.appendChild(article);
 }
}

async function toggleLike(postId,liked){
 let result;
 if(liked){
  result=await db.from("likes").delete().eq("post_id",postId).eq("user_id",currentUser.id);
 }else{
  result=await db.from("likes").insert({post_id:postId,user_id:currentUser.id});
 }
 if(result.error){say("Like नहीं हुआ: "+result.error.message);return;}
 loadPosts();
}

async function addComment(postId){
 const content=prompt("अपना Comment लिखें:");
 if(!content?.trim())return;
 const {error}=await db.from("comments").insert({
  post_id:postId,user_id:currentUser.id,content:content.trim()
 });
 if(error){say("Comment नहीं हुआ: "+error.message);return;}
 say("Comment पोस्ट हो गया!");
}

$("publish").onclick=async()=>{
 const content=$("content").value.trim();
 const file=$("media").files[0];
 if(!content&&!file){say("कुछ लिखें या फोटो/वीडियो चुनें।");return;}
 $("publish").disabled=true;
 let mediaPath=null,mediaType=null;

 if(file){
  if(file.size>50*1024*1024){say("फाइल 50 MB से छोटी रखें।");$("publish").disabled=false;return;}
  const ext=file.name.split(".").pop().toLowerCase();
  const path=currentUser.id+"/"+crypto.randomUUID()+"."+ext;
  const {error:uploadError}=await db.storage.from("apna-media").upload(path,file);
  if(uploadError){say("Media upload error: "+uploadError.message);$("publish").disabled=false;return;}
  mediaPath=path;
  mediaType=file.type.startsWith("video/")?"video":"image";
 }

 const {error}=await db.from("posts").insert({
  user_id:currentUser.id,
  content:content,
  media_url:mediaPath,
  media_type:mediaType
 });
 $("publish").disabled=false;
 if(error){say("पोस्ट सेव नहीं हुई: "+error.message);return;}
 $("content").value="";
 $("media").value="";
 say("आपकी पोस्ट शेयर हो गई!");
 loadPosts();
};

db.auth.onAuthStateChange((event,session)=>{
 showApp(session?.user||null);
});
db.auth.getSession().then(({data})=>showApp(data.session?.user||null));
</script>
</body>
</html>
